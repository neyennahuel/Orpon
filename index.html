<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E1251B" />
    <title>Orpon Descartables</title>
    <link rel="icon" href="./brand/logo.png" />
    <link rel="stylesheet" href="./github-pages.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="./brand/logo.png" alt="Orpon Descartables" />
          <div>
            <h1>Orpon Descartables</h1>
            <p>Gestion comercial</p>
          </div>
        </div>
        <nav class="tabs">
          <button class="tab active" data-tab="lista">Lista</button>
          <button class="tab" data-tab="base">Base</button>
          <button class="tab" data-tab="costos">Costos</button>
          <button class="tab" data-tab="porcentajes">Porcentajes</button>
          <button class="tab" data-tab="stock">Stock</button>
          <button class="tab" data-tab="productos">Productos</button>
        </nav>
      </header>

      <main class="main">
        <section id="lista" class="view active">
          <div class="panel">
            <h2>Lista de precios</h2>
            <div class="grid two">
              <label class="field"><span>Codigo o descripcion</span><input id="filterQ" class="input" /></label>
              <label class="field"><span>Categoria</span><select id="filterCategory" class="select"></select></label>
              <label class="field"><span>Proveedor</span><select id="filterProvider" class="select"></select></label>
              <label class="field"><span>Estado</span><select id="filterActive" class="select"><option value="">Todos</option><option value="true">Activos</option><option value="false">Inactivos</option></select></label>
            </div>
            <div class="actions">
              <button class="btn" id="exportExcel">Exportar Excel</button>
              <button class="btn secondary" id="exportPdf">Exportar PDF</button>
            </div>
          </div>
          <div class="panel" id="productsView"></div>
        </section>

        <section id="base" class="view">
          <div class="panel">
            <h2>Carga de base</h2>
            <div class="actions">
              <button class="btn secondary" id="downloadTemplate">Descargar plantilla</button>
              <label class="btn">Importar Excel<input hidden id="baseFile" type="file" accept=".xlsx,.xls" /></label>
            </div>
            <div id="baseSummary"></div>
          </div>
        </section>

        <section id="costos" class="view">
          <div class="panel">
            <h2>Actualizacion de costos</h2>
            <label class="btn">Analizar Excel<input hidden id="costFile" type="file" accept=".xlsx,.xls" /></label>
            <div id="costPreview"></div>
          </div>
        </section>

        <section id="porcentajes" class="view">
          <div class="panel">
            <h2>Porcentajes</h2>
            <div class="grid two">
              <label class="field"><span>% aumento mayorista</span><input id="wholesalePercentage" class="input" type="number" min="0" step="0.01" /></label>
              <label class="field"><span>% aumento minorista</span><input id="retailPercentage" class="input" type="number" min="0" step="0.01" /></label>
              <label class="field"><span>% precio promocional 1</span><input id="promo1Percentage" class="input" type="number" min="0" step="0.01" /></label>
              <label class="field"><span>% precio promocional 2</span><input id="promo2Percentage" class="input" type="number" min="0" step="0.01" /></label>
            </div>
            <div class="actions"><button class="btn good" id="saveSettings">Guardar</button></div>
          </div>
        </section>

        <section id="stock" class="view">
          <div class="panel">
            <h2>Stock</h2>
            <form id="stockForm" class="grid two">
              <label class="field"><span>Buscar producto</span><input id="stockSearch" class="input" placeholder="Codigo o descripcion" /></label>
              <label class="field"><span>Producto</span><select id="stockProduct" class="select" required></select></label>
              <label class="field"><span>Tipo</span><select id="stockType" class="select"><option value="entrada">Entrada</option><option value="salida">Salida</option><option value="ajuste">Ajuste</option></select></label>
              <label class="field"><span>Cantidad</span><input id="stockQuantity" class="input" type="number" min="0.01" step="0.01" value="1" required /></label>
              <label class="field"><span>Motivo</span><input id="stockReason" class="input" required /></label>
              <label class="field"><span>Observaciones</span><textarea id="stockNotes" class="textarea"></textarea></label>
              <div class="actions"><button class="btn good">Registrar</button></div>
            </form>
          </div>
          <div class="panel"><h3>Ultimos movimientos</h3><div id="movementsView"></div></div>
        </section>

        <section id="productos" class="view">
          <div class="panel">
            <h2>Producto</h2>
            <form id="productForm" class="grid two">
              <label class="field autocomplete-field"><span>Codigo</span><input id="code" class="input" required /><div id="codeSuggestions" class="suggestions hidden"></div></label>
              <label class="field autocomplete-field"><span>Descripcion</span><input id="description" class="input" required /><div id="descriptionSuggestions" class="suggestions hidden"></div></label>
              <label class="field"><span>Categoria</span><input id="category" class="input" required /></label>
              <label class="field"><span>Proveedor</span><input id="provider" class="input" required /></label>
              <label class="field"><span>Costo</span><input id="costPrice" class="input" type="number" min="0" step="0.01" required /></label>
              <label class="field"><span>Unidad</span><input id="unitMeasure" class="input" /></label>
              <label class="checkbox-row"><input id="active" type="checkbox" checked /> Activo</label>
              <div class="actions"><button class="btn good">Guardar producto</button></div>
            </form>
          </div>
        </section>
      </main>
    </div>

    <div id="modal" class="modal-backdrop hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <script src="./github-pages.js"></script>
  </body>
</html>
